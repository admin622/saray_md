<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <title>Anbar üçün QR Kod Oxucu</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.1.0/css/bootstrap.min.css"/>
  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode/minified/html5-qrcode.min.js"></script>
</head>
<body class="container p-4">

<h3>Anbara QR kodla mal qəbulu</h3>
<div id="qr-reader" style="width:300px;"></div>
<div id="result"></div>

<script>
const qrResult = document.getElementById('result');
let scannedItems = JSON.parse(localStorage.getItem("scannedItems")) || [];

function onScanSuccess(decodedText, decodedResult) {
  const parsedData = JSON.parse(decodedText);
  const existingItem = scannedItems.find(item => item.Tay_nömrəsi === parsedData.Tay_nömrəsi);

  if (existingItem) {
    qrResult.innerHTML = `<div class="alert alert-danger">⚠️ Bu mal artıq anbara qəbul olunub! (Tay №: ${parsedData.Tay_nömrəsi})</div>`;
  } else {
    scannedItems.push(parsedData);
    localStorage.setItem("scannedItems", JSON.stringify(scannedItems));
    qrResult.innerHTML = `<div class="alert alert-success">✅ Mal anbara uğurla əlavə edildi! (Tay №: ${parsedData.Tay_nömrəsi})</div>`;
    saveToJSONBin(parsedData);
  }
}

let html5QrcodeScanner = new Html5QrcodeScanner(
  "qr-reader", { fps: 10, qrbox: 250 });
html5QrcodeScanner.render(onScanSuccess);

// JSONBin API inteqrasiyası
async function saveToJSONBin(data) {
  const binID = 'your-bin-id';
  const secretKey = 'your-api-key';
  const response = await fetch(`https://api.jsonbin.io/v3/b/${binID}`, {
    method: 'PUT',
    headers: {
      'Content-Type': 'application/json',
      'X-Master-Key': secretKey
    },
    body: JSON.stringify(scannedItems)
  });

  const result = await response.json();
  console.log(result);
}
</script>
</body>
</html>
