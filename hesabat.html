<!DOCTYPE html>
<html lang="az">
<head>
  <title>Anbar Hesabatı</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-2">
  <h3>Anbar Hesabatı 📋</h3>

  <input type="text" id="filterType" placeholder="Növ üzrə axtar" class="form-control mb-2">
  <input type="date" id="filterDate" class="form-control mb-2">
  <button onclick="loadData()" class="btn btn-primary">Axtar 🔍</button>

  <table class="table table-striped mt-2">
    <thead><tr><th>Çəki</th><th>Növü</th><th>Tay №</th><th>Sıra</th><th>Tarix</th></tr></thead>
    <tbody id="tableBody"></tbody>
  </table>

  <div id="summary" class="alert alert-info"></div>

  <script>
    const JSONBIN_URL = 'https://api.jsonbin.io/v3/b/67cea66d8a456b7966731212/latest';
    const JSONBIN_API_KEY = '$2a$10$P/0Z.dlxFFcZIX9AkGeE3O/z1LmA8bSygSfzmsXrTgc.BX9AkGeE3O';

    async function loadFromJSONBin() {
      const response = await fetch(JSONBIN_URL + '/latest', {
        headers: { 'X-Master-Key': JSONBIN_API_KEY }
      });
      const result = await response.json();
      return result.record;
    }

    async function renderData() {
      const data = await loadFromJSONBin();
      localStorage.setItem('anbar', JSON.stringify(data));

      const table = data.map(item => `
        <tr>
          <td>${item.Çəki}</td>
          <td>${item.Növü}</td>
          <td>${item.Tay_nömrəsi}</td>
          <td>${item.Sıra}</td>
          <td>${item.Tarix}</td>
        </tr>`).join('');
      
      document.getElementById('tableBody').innerHTML = table;
      calculateSummary(data);
    }

    function calculateGeneral(data) {
      const summary = {};
      data.forEach(i => summary[i.Növü] = (summary[i.Növü] || 0) + parseFloat(i.Çəki));
      let text = "Ümumi çəkilər:<br>";
      for (const key in summary) text += `${key}: ${summary[key]} kg<br>`;
      document.getElementById("general").innerHTML = text;
    }

    window.onload = loadFromJSONBin;
  </script>

  <div id="general" class="alert alert-primary mt-3"></div>
</body>
</html>
