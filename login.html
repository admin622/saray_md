<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - Zaqatala Agro Industry MMC</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #f2f2f2; }
    .container { max-width: 400px; margin: 100px auto; padding: 20px; background: #fff; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.3); }
    input[type="text"], input[type="password"] { width: 100%; padding: 10px; margin: 5px 0 15px; border: 1px solid #ccc; border-radius: 4px; }
    button { width: 100%; padding: 10px; background-color: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background-color: #45a049; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Login</h2>
    <form id="loginForm">
      <label for="username">İstifadəçi adı:</label>
      <input type="text" id="username" required>
      <label for="password">Şifrə:</label>
      <input type="password" id="password" required>
      <button type="submit">Daxil ol</button>
    </form>
    <div id="error" style="color:red;"></div>
  </div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      var username = document.getElementById('username').value;
      var password = document.getElementById('password').value;
      // Demo məqsədi üçün: username: admin, şifrə: admin
      if(username === "admin" && password === "admin"){
        sessionStorage.setItem("loggedIn", "true");
        window.location.href = "main.html";
      } else {
        document.getElementById('error').textContent = "Yanlış istifadəçi adı və ya şifrə.";
      }
    });
  </script>
</body>
</html>
