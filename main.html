<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zaqatala Agro Industry MMC - Anbar Qeydiyyatı</title>
  <!-- jQuery -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <!-- Toastr CSS və JS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
  <!-- html5-qrcode kitabxanası -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  <!-- Firebase SDK (v8) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
    header { background-color: #4CAF50; color: white; padding: 10px; text-align: center; }
    .container { padding: 20px; }
    button { padding: 10px 20px; margin: 10px 0; border: none; border-radius: 4px; background-color: #4CAF50; color: white; cursor: pointer; }
    button:hover { background-color: #45a049; }
    #scannedList { margin-top: 20px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background-color: #f2f2f2; }
    #reader { width: 300px; margin: 20px auto; display: none; }
  </style>
  <script>
    // Firebase konfiqurasiyası - aşağıdakı dəyərləri öz Firebase layihənizdən kopyalayın
    var firebaseConfig = {
      apiKey: "AIzaSyDc7yQhIyIyT6Boh889UF6vRjNoSzgMxU4",
      authDomain: "main-2283c.firebaseapp.com",
      databaseURL: "https://main-2283c-default-rtdb.firebaseio.com/",
      projectId: "main-2283c",
      storageBucket: "main-2283c.firebasestorage.app",
      messagingSenderId: "779751119477",
      appId: "1:779751119477:web:91fd8e4fbfc5b017fbb63c"
    };
    // Firebase-i başlatmaq
    firebase.initializeApp(firebaseConfig);
  </script>
</head>
<body>
  <header>
    <h1>Zaqatala Agro Industry MMC - Anbar Qeydiyyatı</h1>
  </header>
  <div class="container">
    <button id="scanBtn">BR kod oxut</button>
    <div id="reader"></div>
    <div id="scannedList">
      <h3>Oxunan BR kodlar</h3>
      <table>
        <thead>
          <tr>
            <th>Sıra</th>
            <th>BR kod</th>
            <th>Tarix & Saat</th>
          </tr>
        </thead>
        <tbody id="codeTableBody">
          <!-- Oxunan kodlar burada göstəriləcək -->
        </tbody>
      </table>
    </div>
    <button onclick="window.location.href='report.html'">Hesabat Səhifəsi</button>
  </div>

  <script>
    // Əgər login olunmayıbsa, login səhifəsinə yönləndiririk (opsional)
    if(sessionStorage.getItem("loggedIn") !== "true"){
      window.location.href = "login.html";
    }

    let scannedCodes = JSON.parse(localStorage.getItem("scannedCodes") || "[]");

    // Cədvəli yenidən render edən funksiya
    function renderTable() {
      const tbody = document.getElementById('codeTableBody');
      tbody.innerHTML = "";
      scannedCodes.forEach((item, index) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${index + 1}</td>
          <td>${item.code}</td>
          <td>${item.timestamp}</td>
        `;
        tbody.appendChild(tr);
      });
    }
    renderTable();

    let html5QrCode;
    const scanBtn = document.getElementById('scanBtn');

    // Firebase-ə məlumat göndərən funksiya
    function syncToFirebase(data) {
      firebase.database().ref('scannedCodes').push(data)
        .then(function() {
          console.log("Data synced to Firebase:", data);
          toastr.success("Məlumat Firebase-ə göndərildi!");
        })
        .catch(function(error) {
          console.error("Firebase sync error:", error);
          toastr.error("Firebase-ə göndərmə zamanı xəta baş verdi!");
        });
    }

    scanBtn.addEventListener('click', function() {
      const readerElem = document.getElementById('reader');
      readerElem.style.display = 'block';
      html5QrCode = new Html5Qrcode("reader");
      const config = { fps: 10, qrbox: 250 };

      html5QrCode.start(
        { facingMode: "environment" },
        config,
        (decodedText, decodedResult) => {
          html5QrCode.stop().then(() => {
            readerElem.style.display = 'none';
          }).catch(err => {
            console.error(err);
          });

          // Təkrar oxunmanın qarşısını alırıq
          if(scannedCodes.some(item => item.code === decodedText)){
            alert("Bu BR kod artıq oxunub!");
            return;
          }

          const now = new Date();
          const timestamp = now.toLocaleString();

          // LocalStorage-ə əlavə edirik
          const newItem = { code: decodedText, timestamp: timestamp };
          scannedCodes.push(newItem);
          localStorage.setItem("scannedCodes", JSON.stringify(scannedCodes));
          renderTable();

          // Firebase-ə göndərmək üçün data obyekti
          const dataForFirebase = {
            Növü: "Naməlum",          // Əgər əlavə məlumat varsa, onu parse edin
            Tay_nömrəsi: decodedText,  // decodedText-i tay nömrəsi kimi istifadə edirik
            Çəki: "50",                // Demo məqsədi üçün sabit 50
            Sıra: "1",                 // Demo məqsədi üçün sabit 1
            Tarix_və_saat: timestamp
          };
          syncToFirebase(dataForFirebase);
        },
        (errorMessage) => {
          console.log(`Kod oxunmadı: ${errorMessage}`);
        }
      ).catch(err => {
        console.error(err);
      });
    });
  </script>
</body>
</html>
