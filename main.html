<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BR Kod Oxuma</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.1.0/css/bootstrap.min.css" rel="stylesheet">
  <!-- QuaggaJS (BR kod oxumaq üçün) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
      padding: 20px;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    /* Kamera konteyneri – masaüstü və mobil üçün uyğun ölçüdə */
    .scanner-container {
      width: 100%;
      max-width: 400px;
      height: 300px; /* Masaüstü üçün sabit hündürlük */
      margin: 0 auto 20px;
      border: 1px solid #ccc;
      border-radius: 5px;
      overflow: hidden;
    }
    #interactive {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .btn-custom {
      margin: 5px;
    }
    .result {
      margin: 15px auto;
      padding: 10px;
      background: #fff;
      border: 1px solid #007bff;
      border-radius: 5px;
      white-space: pre-wrap;
      text-align: left;
      max-width: 400px;
    }
    /* Oxunan BR kodların siyahısı */
    .scanned-table {
      background: #fff;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 5px;
      max-width: 100%;
      overflow-x: auto;
    }
    @media (max-width: 600px) {
      .scanner-container {
        width: 100%;
        height: 200px; /* Mobil üçün hündürlük azaldılır */
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <h2>BR Kod Oxuma</h2>
    <a href="hesabat.html" class="btn btn-sm btn-secondary">Hesabat Səhifəsinə Keçid</a>
  </div>

  <!-- BR kod oxuma paneli -->
  <div class="scanner-container">
    <div id="interactive" class="viewport"></div>
  </div>
  <div class="text-center">
    <button id="startScan" class="btn btn-primary btn-custom">Oxunmanı Başlat</button>
    <button id="stopScan" class="btn btn-danger btn-custom" style="display:none;">Oxunmanı Dayandır</button>
  </div>

  <!-- Oxunan məlumatın göstərildiyi panel -->
  <div id="resultDisplay" class="result" style="display:none;">
    <h5>Oxunan Məlumat:</h5>
    <p id="infoText"></p>
  </div>

  <!-- Oxunan BR kodların siyahısı -->
  <div class="scanned-table container mt-4">
    <h5 class="text-center">Oxunan BR Kodlar</h5>
    <table class="table table-bordered table-sm">
      <thead>
        <tr>
          <th>#</th>
          <th>Çəki</th>
          <th>Növü</th>
          <th>Tay nömrəsi</th>
          <th>Sıra</th>
          <th>Tarix</th>
        </tr>
      </thead>
      <tbody id="scannedListBody">
        <!-- Avtomatik əlavə olunacaq -->
      </tbody>
    </table>
  </div>

  <script>
    // JSONBin parametrləri
    const JSONBIN_BIN_ID = '67cea66d8a456b7966731212';
    const JSONBIN_API_KEY = '$2a$10$P/0Z.dlxFFcZIX9AkGeE3O/z1LmUXZVsTgc.BX/m.ofHOK.jsDVgq';
    const JSONBIN_URL = 'https://api.jsonbin.io/v3/b/' + JSONBIN_BIN_ID;

    // Lokal olaraq saxlanılan qeydlər
    let scannedCodes = [];
    let bookshelf = JSON.parse(localStorage.getItem('unreadBooks')) || [];
    let lastTayNumber = parseInt(localStorage.getItem('lastTayNumber')) || 0;

    window.onload = function() {
      renderScannedList();
    };

    // JSONBin‑ə məlumat göndərən funksiya
    async function updateJSONBin(data) {
      try {
        const response = await fetch(JSONBIN_URL + '/latest', {
          headers: { 'X-Master-Key': JSONBIN_API_KEY }
        });
        const json = await response.json();
        let currentData = json.record || [];
        currentData.push(data);
        await fetch(JSONBIN_URL, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'X-Master-Key': JSONBIN_API_KEY
          },
          body: JSON.stringify(currentData)
        });
      } catch (error) {
        console.error('JSONBin update error:', error);
      }
    }

    // QuaggaJS ilə BR kod oxuyucusunu işə salan funksiya (optimizə olunub)
    function startScanner() {
      Quagga.init({
        inputStream: {
          name: "Live",
          type: "LiveStream",
          target: document.querySelector('#interactive'),
          constraints: {
            facingMode: "environment",
            width: { min: 320, ideal: 640, max: 800 },
            height: { min: 240, ideal: 480, max: 600 }
          }
        },
        decoder: {
          readers: ["code_128_reader"],
          // Əlavə debug parametrlərini aktivləşdirə bilərsiniz
          debug: {
            drawBoundingBox: false,
            showFrequency: false,
            drawScanline: false
          }
        },
        locate: true,
        numOfWorkers: navigator.hardwareConcurrency || 4,
        singleChannel: true, // Qara-ağ işləmə, sürət artırır
        halfSample: false,
        patchSize: "medium"
      }, function(err) {
        if (err) {
          console.error(err);
          alert('Oxuyucu başlatılarkən xəta baş verdi.');
          return;
        }
        Quagga.start();
        document.getElementById('startScan').style.display = 'none';
        document.getElementById('stopScan').style.display = 'inline-block';
      });
      Quagga.onDetected(onDetected);
    }

    function stopScanner() {
      Quagga.stop();
      document.getElementById('startScan').style.display = 'inline-block';
      document.getElementById('stopScan').style.display = 'none';
    }

    // BR kod oxunduqda emal edən funksiya (gözlənilən format: "Çəki|Növü|Tay nömrəsi|Sıra")
    function onDetected(result) {
      let code = result.codeResult.code.trim();
      if (code.indexOf('|') === -1 && code.indexOf('/') !== -1) {
        code = code.replace(/\//g, '|');
      }
      const parts = code.split('|').map(item => item.trim());
      if (parts.length < 4) {
        alert('BR kod yalnış format!');
        return;
      }
      if (scannedCodes.includes(code)) {
        alert('Bu BR kod artıq oxunub!');
        return;
      }
      scannedCodes.push(code);
      
      const data = {
        "Çəki": parts[0],
        "Növü": parts[1],
        "Tay_nömrəsi": parts[2],
        "Sıra": parts[3],
        "Oxunma_tarixi": new Date().toISOString()
      };
      
      // Nəticəni ekranda göstəririk
      document.getElementById('infoText').innerText =
        `Çəki: ${data["Çəki"]} kg\nNövü: ${data["Növü"]}\nTay nömrəsi: ${data["Tay_nömrəsi"]}\nSıra: ${data["Sıra"]}`;
      document.getElementById('resultDisplay').style.display = 'block';
      
      // Lokal yaddaşa əlavə et və JSONBin‑ə göndər
      save(data);
      updateJSONBin(data);
      
      // Kameranı dayandırırıq, siyahını yeniləyirik və hesabat səhifəsinə yönləndiririk
      stopScanner();
      renderScannedList();
      setTimeout(() => {
        window.location.href = "hesabat.html";
      }, 1000);
    }

    // Məlumatı yerli yaddaşa əlavə edir və lastTayNumber yenilənir
    function save(data) {
      lastTayNumber++;
      data["Tay_nömrəsi"] = lastTayNumber;
      bookshelf.unshift(data);
      localStorage.setItem('unreadBooks', JSON.stringify(bookshelf));
      localStorage.setItem('lastTayNumber', lastTayNumber);
    }

    // Oxunan BR kodların siyahısını cədvəl şəklində göstərən funksiya
    function renderScannedList() {
      const tbody = document.getElementById('scannedListBody');
      tbody.innerHTML = "";
      bookshelf.forEach((item, index) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${index + 1}</td>
          <td>${item["Çəki"]}</td>
          <td>${item["Növü"]}</td>
          <td>${item["Tay_nömrəsi"]}</td>
          <td>${item["Sıra"]}</td>
          <td>${item["Tarix"] ? item["Tarix"].replace(/-/g, '.') : new Date(item["Oxunma_tarixi"]).toISOString().split('T')[0].replace(/-/g, '.')}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    // Düymə hadisələri
    document.getElementById('startScan').addEventListener('click', startScanner);
    document.getElementById('stopScan').addEventListener('click', stopScanner);
  </script>
</body>
</html>
