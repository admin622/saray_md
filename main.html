<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zaqatala Agro Industry MMC - Anbar Qeydiyyatı</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css"/>
  <style>
    body { padding: 15px; }
    #reader { width: 100%; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="container">
    <h3 class="text-center">Zaqatala Agro Industry MMC - Anbar Qeydiyyatı 📦</h3>
    <button id="scanBtn" class="btn btn-success w-100 mt-3 mb-3">📷 BR Kod Oxut</button>
    <div id="reader" style="display:none;"></div>

    <table class="table table-bordered table-striped">
      <thead class="table-success">
        <tr>
          <th>#</th>
          <th>Çəkisi</th>
          <th>Növü</th>
          <th>Tay №</th>
          <th>Sıra</th>
          <th>Tarix & Saat</th>
        </tr>
      </thead>
      <tbody id="codeTableBody"></tbody>
    </table>

    <a href="hesabat.html" class="btn btn-primary w-100">📊 Hesabat Səhifəsinə Keç</a>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>

  <script>
    const JSONBIN_API_KEY = "$2a$10$P/0Z.dlxFFcZIX9AkGeE3O/z1LmUXZVsTgc.BX/m.ofHOK.jsDVgq";
    const JSONBIN_BIN_ID = "67cea66d8a456b7966731212";
    const JSONBIN_URL = `https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`;

    let scannedCodes = JSON.parse(localStorage.getItem("scannedCodes")) || [];

    function renderTable(){
      const tbody = $("#codeTableBody").empty();
      scannedCodes.forEach((item, index) => {
        tbody.append(`
          <tr>
            <td>${index + 1}</td>
            <td>${item.cekisi} kg</td>
            <td>${item.novu}</td>
            <td>${item.tay_nomresi}</td>
            <td>${item.sira}</td>
            <td>${item.timestamp}</td>
          </tr>`);
      });
    }

    function syncToJSONBin(){
      $.ajax({
        url: JSONBIN_URL,
        type: "PUT",
        headers: { 
          "Content-Type": "application/json", 
          "X-Master-Key": JSONBIN_API_KEY 
        },
        data: JSON.stringify(scannedCodes),
        success: () => toastr.success("✅ JSONBin ilə sinxronizasiya edildi!"),
        error: () => toastr.error("❌ JSONBin ilə əlaqə qurulmadı!")
      });
    }

   function startScanner() {
  const qrCode = new Html5Qrcode("reader");
  $("#reader").show();

  qrCode.start(
    { facingMode: "environment" }, 
    { fps: 10, qrbox: 250 },
    (decodedText) => {
      qrCode.stop().then(() => {
        $("#reader").hide();
      }).catch(err => console.error(err));

      if (scannedCodes.some(item => item.code === decodedText)) {
        toastr.warning("⚠️ Bu BR kod artıq mövcuddur!");
        return;
      }

      const parts = decodedText.split('|');
      if (parts.length !== 4) {
        toastr.error("❌ BR kod formatı yanlışdır!");
        return;
      }

      const cekisi = parts[0].split(":")[1].replace("kg", "").trim();
      const novu = parts[1].split(":")[1].trim();
      const tay_nomresi = parts[2].split(":")[1].trim();
      const sira = parts[3].split(":")[1].trim();

      const newItem = {
        code: decodedText,
        cekisi,
        novu,
        tay_nomresi,
        sira,
        timestamp: new Date().toLocaleString()
      };

      scannedCodes.push(newItem);
      localStorage.setItem("scannedCodes", JSON.stringify(scannedCodes));
      renderTable();
      syncToJSONBin();
    },
    (errorMessage) => {
      console.warn(`QR kod oxunmadı: ${errorMessage}`);
    }
  ).catch(err => {
    toastr.error("❌ Kamera açılarkən xəta yarandı: " + err);
  });
}

$(document).ready(function() {
  $("#scanBtn").click(startScanner);
  scannedCodes = JSON.parse(localStorage.getItem("scannedCodes")) || [];
  renderTable();
});

    function renderTable(){
      $("#codeTableBody").empty();
      scannedCodes.forEach((item, index) => {
        $("#codeTableBody").append(`
          <tr>
            <td>${index + 1}</td>
            <td>${item.cekisi} kg</td>
            <td>${item.novu}</td>
            <td>${item.tay_nomresi}</td>
            <td>${item.sira}</td>
            <td>${item.timestamp}</td>
          </tr>
        `);
      });
    }

    $(document).ready(function(){
      scannedCodes = JSON.parse(localStorage.getItem("scannedCodes")) || [];
      renderTable();
      $("#scanBtn").click(startScanner);
    });
  </script>

  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.1.3/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
</body>
</html>
