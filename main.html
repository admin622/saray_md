<!-- main.html - Tam işlək və düzgün versiya -->
<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zaqatala Agro Industry MMC - Anbar Qeydiyyatı</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f8f9fa;}
    header {background-color: #4CAF50; color: white; padding: 10px; text-align: center;}
    .container {padding: 20px; max-width: 800px; margin: auto;}
    button {padding: 10px; border: none; border-radius: 4px; background-color: #4CAF50; color: white; cursor: pointer;}
    button:hover {background-color: #45a049;}
    input {width: 100%; padding: 5px; margin-bottom: 10px;}
    table {width: 100%; border-collapse: collapse; margin-top: 10px;}
    th, td {border: 1px solid #ddd; padding: 8px; text-align: left;}
    th {background-color: #f2f2f2;}
    #reader {width: 300px; margin: 20px auto; display: none;}
  </style>
</head>
<body>
  <header><h1>Zaqatala Agro Industry MMC - Anbar Qeydiyyatı</h1></header>
  <div class="container">
    <button id="scanBtn">BR kod oxut</button>
    <div id="reader"></div>

    <label>Növü:</label>
    <input type="text" id="novu" placeholder="Tütün növü daxil edin...">
    <label>Çəkisi (kg):</label>
    <input type="number" id="cekisi">
    <label>Sıra:</label>
    <input type="text" id="sira">

    <button id="saveDataBtn">Məlumatı Saxla</button>

    <table>
      <thead>
        <tr>
          <th>Sıra</th>
          <th>BR kod</th>
          <th>Növü</th>
          <th>Tay nömrəsi</th>
          <th>Çəkisi</th>
          <th>Sıra</th>
          <th>Tarix & Saat</th>
        </tr>
      </thead>
      <tbody id="codeTableBody"></tbody>
    </table>
    <button onclick="window.location.href='report.html'">Hesabat Səhifəsi</button>
  </div>

  <script>
    const JSONBIN_API_KEY = "$2a$10$P/0Z.dlxFFcZIX9AkGeE3O/z1LmUXZVsTgc.BX/m.ofHOK.jsDVgq";
    const JSONBIN_BIN_ID = "67cea66d8a456b796673121";
    const JSONBIN_URL = `https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`;

    let scannedCodes = JSON.parse(localStorage.getItem("scannedCodes") || "[]");
    let currentBRCode = "";

    function renderTable() {
      $("#codeTableBody").html("");
      scannedCodes.forEach((item, index) => {
        $("#codeTableBody").append(`
          <tr>
            <td>${index + 1}</td>
            <td>${item.code}</td>
            <td>${item.novu}</td>
            <td>${item.tay_nomresi}</td>
            <td>${item.cekisi}</td>
            <td>${item.sira}</td>
            <td>${item.timestamp}</td>
          </tr>`);
      });
    }

    function syncToJSONBin() {
      $.ajax({
        url: JSONBIN_URL,
        type: "PUT",
        headers: {
          "Content-Type": "application/json",
          "X-Master-Key": JSONBIN_API_KEY
        },
        data: JSON.stringify(scannedCodes),
        success: () => toastr.success("JSONBin-ə uğurla göndərildi!"),
        error: () => toastr.error("JSONBin-ə göndərilmədi!")
      });
    }

    $("#scanBtn").click(() => {
      $("#reader").show();
      let html5QrCode = new Html5Qrcode("reader");

      html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 },
        (decodedText) => {
          html5QrCode.stop().then(() => $("#reader").hide());
          if (scannedCodes.some(item => item.code === decodedText)) {
            toastr.error("Bu BR kod artıq oxunub!");
            return;
          }
          currentBRCode = decodedText;
          toastr.success("Oxunan BR kod: " + decodedText);
        }
      );
    });

    $("#saveDataBtn").click(() => {
      if (!currentBRCode) { alert("Əvvəlcə BR kod oxudun!"); return; }
      const now = new Date().toLocaleString();

      const newItem = {
        code: currentBRCode,
        novu: $("#novu").val(),
        tay_nomresi: currentBRCode,
        cekisi: $("#cekisi").val() + " kg",
        sira: $("#sira").val(),
        timestamp: now
      };

      scannedCodes.push(newItem);
      localStorage.setItem("scannedCodes", JSON.stringify(scannedCodes));
      syncToJSONBin();
      renderTable();

      currentBRCode = "";
      $("#novu, #cekisi, #sira").val("");
    });

    $(document).ready(renderTable);
  </script>
</body>
</html>
