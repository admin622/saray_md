<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zaqatala Agro Industry MMC - Anbar Qeydiyyatı</title>
  
  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <!-- Toastr CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css"/>

  <style>
    body { padding-top: 20px; }
    .btn-custom { width: 100%; margin-bottom: 10px; }
    #reader { width: 100%; max-width: 500px; margin: 10px auto; }
  </style>
</head>
<body>
  <div class="container text-center">
    <h3>Zaqatala Agro Industry MMC</h3>
    <button id="scanBtn" class="btn btn-success btn-custom">📷 BR Kod Oxut</button>
    <div id="reader" style="display:none;"></div>

    <h5 class="mt-4">📋 Oxunan BR kodlar</h5>
    <table class="table table-striped">
      <thead class="table-success">
        <tr>
          <th>#</th>
          <th>Çəki</th>
          <th>Növü</th>
          <th>Tay №</th>
          <th>Sıra</th>
          <th>Tarix & Saat</th>
        </tr>
      </thead>
      <tbody id="codeTableBody"></tbody>
    </table>

    <a href="hesabat.html" class="btn btn-primary btn-custom">📊 Hesabat Səhifəsinə Keç</a>
  </div>

  <!-- JS Kitabxanaları -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>

  <script>
    const JSONBIN_API_KEY = "$2a$10$P/0Z.dlxFFcZIX9AkGeE3O/z1LmUXZVsTgc.BX/m.ofHOK.jsDVgq";
    const JSONBIN_BIN_ID = "67cea66d8a456b7966731212";
    const JSONBIN_URL = `https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`;

    let scannedCodes = JSON.parse(localStorage.getItem("scannedCodes") || "[]");

    function renderTable() {
      const tbody = $("#codeTableBody").empty();
      scannedCodes.forEach((item, idx) => {
        tbody.append(`
          <tr>
            <td>${idx + 1}</td>
            <td>${item.cekisi}</td>
            <td>${item.novu}</td>
            <td>${item.tay_nomresi}</td>
            <td>${item.sira}</td>
            <td>${item.timestamp}</td>
          </tr>
        `);
      });
    }

    function syncToJSONBin() {
      $.ajax({
        url: JSONBIN_URL,
        type: "PUT",
        headers: { "Content-Type": "application/json", "X-Master-Key": JSONBIN_API_KEY },
        data: JSON.stringify(scannedCodes),
        success: () => toastr.success("✅ JSONBin ilə sinxronizasiya edildi!"),
        error: () => toastr.error("❌ JSONBin ilə sinxronizasiya alınmadı!")
      });
    }

    function startScanner() {
      const qrCode = new Html5Qrcode("reader");
      $("#reader").show();
      qrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 },
        (decodedText) => {
          qrCode.stop().then(() => $("#reader").hide());

          if (scannedCodes.some(code => code.code === decodedText)) {
            toastr.warning("⚠️ Bu BR kod artıq mövcuddur!");
            return;
          }

          const parts = decodedText.split("|").map(p => p.trim());
          if (parts.length !== 4) {
            toastr.error("❌ BR kod formatı yanlışdır!");
            return;
          }

          const newItem = {
            code: decodedText,
            cekisi: parts[0].split(":")[1].trim(),
            novu: parts[1].split(":")[1].trim(),
            tay_nomresi: parts[2].split(":")[1].trim(),
            sira: parts[3].split(":")[1].trim(),
            timestamp: new Date().toLocaleString()
          };

          scannedCodes.push(newItem);
          localStorage.setItem("scannedCodes", JSON.stringify(scannedCodes));
          renderTable();
          syncToJSONBin();
        },
        (errorMessage) => {
          console.warn(`Kod oxunmadı: ${errorMessage}`);
        }
      );
    }

    $("#scanBtn").click(startScanner);

    $(document).ready(renderTable);
  </script>
</body>
</html>
