<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BR Kod Oxuma və JSONBin</title>
  <!-- Bootstrap CSS (Responsive və şık dizayn üçün) -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.1.0/css/bootstrap.min.css" rel="stylesheet">
  <!-- QuaggaJS: Barcode scanning kitabxanası -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f8f9fa;
      padding: 20px;
    }
    h1 {
      margin-bottom: 20px;
    }
    .scanner-container {
      position: relative;
      max-width: 400px;
      margin: 0 auto;
    }
    #interactive {
      width: 100%;
      border: 2px solid #007bff;
      border-radius: 10px;
    }
    .btn-custom {
      margin-top: 10px;
    }
    .result {
      margin-top: 20px;
      padding: 15px;
      background: #fff;
      border: 1px solid #007bff;
      border-radius: 5px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="container text-center">
    <h1>BR Kod Oxuma və JSONBin Yaddaş</h1>
    <div class="scanner-container">
      <div id="interactive" class="viewport"></div>
    </div>
    <div>
      <button id="startScan" class="btn btn-primary btn-custom">Oxunmanı Başlat</button>
      <button id="stopScan" class="btn btn-danger btn-custom" style="display:none;">Oxunmanı Dayandır</button>
    </div>
    <div id="resultDisplay" class="result" style="display:none;">
      <h4>Oxunan məlumat:</h4>
      <p id="infoText"></p>
    </div>
  </div>

  <script>
    // JSONBin parametrləri
    const JSONBIN_BIN_ID = '67cea66d8a456b7966731212';
    const JSONBIN_API_KEY = '$2a$10$P/0Z.dlxFFcZIX9AkGeE3O/z1LmUXZVsTgc.BX/m.ofHOK.jsDVgq';
    const JSONBIN_URL = 'https://api.jsonbin.io/v3/b/' + JSONBIN_BIN_ID;

    let scannedCodes = []; // Oxunmuş kodları yadda saxlamaq üçün

    // JSONBin-ə məlumat əlavə edən funksiya
    async function updateJSONBin(data) {
      try {
        // Əvvəl mövcud məlumatları əldə edirik
        const response = await fetch(JSONBIN_URL + '/latest', {
          headers: { 'X-Master-Key': JSONBIN_API_KEY }
        });
        const json = await response.json();
        let currentData = json.record || [];
        // Yeni məlumatı əlavə edirik
        currentData.push(data);
        // JSONBin-i yeniləyirik
        const updateResponse = await fetch(JSONBIN_URL, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'X-Master-Key': JSONBIN_API_KEY
          },
          body: JSON.stringify(currentData)
        });
        const updateJson = await updateResponse.json();
        console.log('JSONBin updated:', updateJson);
      } catch (error) {
        console.error('JSONBin update error:', error);
      }
    }

    // Oxunan kod nəticəsinin emalı
    function onDetected(result) {
      let code = result.codeResult.code;
      // Təkrar oxunmanın qarşısını almaq
      if (scannedCodes.includes(code)) {
        alert('Bu BR kod artıq oxunub!');
        return;
      }
      scannedCodes.push(code);
      // Koddakı məlumatların formatı: "Çəki|Tay_nömrəsi|Növü|Sıra"
      const parts = code.split('|');
      if(parts.length < 4){
        alert('Yanlış formatda BR kod!');
        return;
      }
      const data = {
        "Çəki": parts[0],
        "Tay_nömrəsi": parts[1],
        "Növü": parts[2],
        "Sıra": parts[3],
        "Oxunma_tarixi": new Date().toISOString()
      };
      // Ekranda məlumatları göstəririk
      document.getElementById('infoText').innerText =
        `Çəki: ${data["Çəki"]} kg\nTay nömrəsi: ${data["Tay_nömrəsi"]}\nNövü: ${data["Növü"]}\nSıra: ${data["Sıra"]}`;
      document.getElementById('resultDisplay').style.display = 'block';
      // JSONBin‑ə məlumatı göndəririk
      updateJSONBin(data);
    }

    // QuaggaJS ilə oxuyucunu işə salan funksiya
    function startScanner() {
      Quagga.init({
        inputStream : {
          name : "Live",
          type : "LiveStream",
          target: document.querySelector('#interactive'),
          constraints: {
            facingMode: "environment"
          }
        },
        decoder : {
          readers : ["code_128_reader"]
        }
      }, function(err) {
          if (err) {
              console.error(err);
              alert('Oxuyucu başlatılarkən xəta baş verdi.');
              return;
          }
          Quagga.start();
          document.getElementById('startScan').style.display = 'none';
          document.getElementById('stopScan').style.display = 'inline-block';
      });
      Quagga.onDetected(onDetected);
    }

    // Oxuyucunu dayandıran funksiya
    function stopScanner() {
      Quagga.stop();
      document.getElementById('startScan').style.display = 'inline-block';
      document.getElementById('stopScan').style.display = 'none';
    }

    // Düymə hadisələri
    document.getElementById('startScan').addEventListener('click', startScanner);
    document.getElementById('stopScan').addEventListener('click', stopScanner);
  </script>
</body>
</html>
