<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BR Kod Oxuma - Main</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.1.0/css/bootstrap.min.css" rel="stylesheet">
  <!-- QuaggaJS (BR kod oxumaq üçün) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background: #f8f9fa;
      margin: 0;
      padding: 20px;
    }
    .header {
      background: linear-gradient(135deg, #007bff, #00aaff);
      color: #fff;
      padding: 20px;
      border-radius: 15px;
      text-align: center;
      margin-bottom: 30px;
    }
    .header h1 {
      font-size: 2.5rem;
      margin-bottom: 5px;
    }
    .header p {
      font-size: 1.2rem;
      margin: 0;
    }
    .scanner-container {
      width: 100%;
      max-width: 400px;
      height: 300px; /* Masaüstü üçün */
      margin: 0 auto 20px;
      border: 2px solid #007bff;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    #interactive {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .btn-group {
      text-align: center;
      margin-bottom: 20px;
    }
    .btn-group button {
      margin: 5px;
    }
    .result {
      background: #fff;
      border: 1px solid #007bff;
      border-radius: 15px;
      padding: 15px;
      max-width: 400px;
      margin: 0 auto 30px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      text-align: left;
    }
    .result h5 {
      margin-bottom: 10px;
    }
    .scanned-table {
      background: #fff;
      border: 2px solid #007bff;
      border-radius: 15px;
      padding: 15px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      margin-top: 20px;
    }
    .scanned-table h5 {
      text-align: center;
      margin-bottom: 15px;
    }
    .scanned-table table {
      width: 100%;
    }
    .scanned-table th {
      background: #007bff;
      color: #fff;
      text-align: center;
    }
    .scanned-table td {
      text-align: center;
    }
    @media (max-width: 600px) {
      .scanner-container {
        height: 200px;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>BR Kod Oxuma</h1>
    <p>Məlumatlar avtomatik yaddaşa və JSONBin‑ə göndərilir</p>
    <a href="hesabat.html" class="btn btn-light btn-sm mt-3">Hesabat Səhifəsinə Keçid</a>
  </div>
  
  <!-- Scanner paneli -->
  <div class="scanner-container">
    <div id="interactive" class="viewport"></div>
  </div>
  
  <div class="btn-group">
    <button id="startScan" class="btn btn-primary">Oxunmanı Başlat</button>
    <button id="stopScan" class="btn btn-danger" style="display:none;">Oxunmanı Dayandır</button>
  </div>
  
  <!-- Nəticə paneli -->
  <div id="resultDisplay" class="result" style="display:none;">
    <h5>Oxunan Məlumat:</h5>
    <p id="infoText"></p>
  </div>
  
  <!-- Oxunan BR kodlar cədvəli -->
  <div class="scanned-table container">
    <h5>Oxunan BR Kodlar</h5>
    <table class="table table-bordered table-sm">
      <thead>
        <tr>
          <th>#</th>
          <th>Çəki</th>
          <th>Növü</th>
          <th>Tay nömrəsi</th>
          <th>Sıra</th>
          <th>Tarix</th>
        </tr>
      </thead>
      <tbody id="scannedListBody">
        <!-- Avtomatik əlavə olunacaq -->
      </tbody>
    </table>
  </div>
  
  <script>
    // JSONBin parametrləri
    const JSONBIN_BIN_ID = '67cea66d8a456b7966731212';
    const JSONBIN_API_KEY = '$2a$10$P/0Z.dlxFFcZIX9AkGeE3O/z1LmUXZVsTgc.BX/m.ofHOK.jsDVgq';
    const JSONBIN_URL = 'https://api.jsonbin.io/v3/b/' + JSONBIN_BIN_ID;
    
    // Lokal yaddaş
    let scannedCodes = [];
    let bookshelf = JSON.parse(localStorage.getItem('unreadBooks')) || [];
    let lastTayNumber = parseInt(localStorage.getItem('lastTayNumber')) || 0;
    
    window.onload = function() {
      renderScannedList();
    };
    
    async function updateJSONBin(data) {
      try {
        const response = await fetch(JSONBIN_URL + '/latest', {
          headers: { 'X-Master-Key': JSONBIN_API_KEY }
        });
        const json = await response.json();
        let currentData = json.record || [];
        currentData.push(data);
        await fetch(JSONBIN_URL, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'X-Master-Key': JSONBIN_API_KEY
          },
          body: JSON.stringify(currentData)
        });
        console.log('JSONBin update success:', data);
      } catch (error) {
        console.error('JSONBin update error:', error);
      }
    }
    
    function startScanner() {
      Quagga.init({
        inputStream: {
          name: "Live",
          type: "LiveStream",
          target: document.querySelector('#interactive'),
          constraints: {
            facingMode: "environment",
            width: { min: 320, ideal: 640, max: 800 },
            height: { min: 240, ideal: 480, max: 600 }
          }
        },
        decoder: {
          readers: ["code_128_reader"],
          debug: {
            drawBoundingBox: false,
            showFrequency: false,
            drawScanline: false
          }
        },
        locate: true,
        numOfWorkers: navigator.hardwareConcurrency || 4,
        singleChannel: true,
        halfSample: false,
        patchSize: "medium"
      }, function(err) {
        if (err) {
          console.error(err);
          alert('Oxuyucu başlatılarkən xəta baş verdi.');
          return;
        }
        Quagga.start();
        document.getElementById('startScan').style.display = 'none';
        document.getElementById('stopScan').style.display = 'inline-block';
      });
      Quagga.onDetected(onDetected);
    }
    
    function stopScanner() {
      Quagga.stop();
      document.getElementById('startScan').style.display = 'inline-block';
      document.getElementById('stopScan').style.display = 'none';
    }
    
    function onDetected(result) {
      let code = result.codeResult.code.trim();
      if (code.indexOf('|') === -1 && code.indexOf('/') !== -1) {
        code = code.replace(/\//g, '|');
      }
      const parts = code.split('|').map(item => item.trim());
      if (parts.length < 4) {
        alert('BR kod yalnış format!');
        return;
      }
      if (scannedCodes.includes(code)) {
        alert('Bu BR kod artıq oxunub!');
        return;
      }
      scannedCodes.push(code);
      
      const data = {
        "Çəki": parts[0],
        "Növü": parts[1],
        "Tay_nömrəsi": parts[2],
        "Sıra": parts[3],
        "Oxunma_tarixi": new Date().toISOString()
      };
      
      document.getElementById('infoText').innerText =
        `Çəki: ${data["Çəki"]} kg\nNövü: ${data["Növü"]}\nTay nömrəsi: ${data["Tay_nömrəsi"]}\nSıra: ${data["Sıra"]}`;
      document.getElementById('resultDisplay').style.display = 'block';
      
      save(data);
      updateJSONBin(data);
      stopScanner();
      renderScannedList();
    }
    
    function save(data) {
      lastTayNumber++;
      data["Tay_nömrəsi"] = lastTayNumber;
      bookshelf.unshift(data);
      localStorage.setItem('unreadBooks', JSON.stringify(bookshelf));
      localStorage.setItem('lastTayNumber', lastTayNumber);
    }
    
    function renderScannedList() {
      const tbody = document.getElementById('scannedListBody');
      tbody.innerHTML = "";
      bookshelf.forEach((item, index) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${index + 1}</td>
          <td>${item["Çəki"]}</td>
          <td>${item["Növü"]}</td>
          <td>${item["Tay_nömrəsi"]}</td>
          <td>${item["Sıra"]}</td>
          <td>${item["Tarix"] ? item["Tarix"].replace(/-/g, '.') : new Date(item["Oxunma_tarixi"]).toISOString().split('T')[0].replace(/-/g, '.')}</td>
        `;
        tbody.appendChild(tr);
      });
    }
    
    document.getElementById('startScan').addEventListener('click', startScanner);
    document.getElementById('stopScan').addEventListener('click', stopScanner);
  </script>
</body>
</html>
