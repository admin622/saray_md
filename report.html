<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zaqatala Agro Industry MMC - Hesabat</title>

  <!-- Bootstrap və Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.1.3/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css"/>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.1/xlsx.full.min.js"></script>

  <style>
    body {
      font-family: 'Arial', sans-serif;
      background-color: #1e1e2d;
      color: white;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 1200px;
      margin: auto;
      background: #2a2a3a;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0px 0px 15px rgba(255, 255, 255, 0.1);
    }
    h1 {
      text-align: center;
      font-weight: bold;
      color: #ffcc00;
    }
    .btn-custom {
      background: #ffcc00;
      color: #1e1e2d;
      font-weight: bold;
      border-radius: 5px;
      padding: 10px 15px;
    }
    .btn-custom:hover {
      background: #d4a900;
      color: white;
    }
    table {
      width: 100%;
      margin-top: 20px;
      border-radius: 10px;
      overflow: hidden;
    }
    table thead {
      background: #ffcc00;
      color: black;
    }
    table tbody {
      background: white;
      color: black;
    }
    .stats {
      display: flex;
      justify-content: space-between;
      background: #ffcc00;
      padding: 15px;
      border-radius: 5px;
      color: black;
      font-weight: bold;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Zaqatala Agro Industry MMC - Hesabat</h1>

    <!-- Tarix seçimi -->
    <div class="row">
      <div class="col-md-6">
        <label for="searchDate">Tarixə görə axtar:</label>
        <input type="date" id="searchDate" class="form-control">
      </div>
      <div class="col-md-6 text-end">
        <button class="btn btn-custom mt-4" onclick="downloadExcel()"><i class="fas fa-file-excel"></i> Excelə İxrac Et</button>
      </div>
    </div>

    <!-- Ümumi Məlumatlar -->
    <div class="stats mt-3">
      <div>Toplam Tay Sayı: <span id="totalTayCount">0</span></div>
      <div>Ümumi Çəki: <span id="totalWeight">0</span> kg</div>
    </div>

    <!-- Cədvəl -->
    <table class="table table-striped">
      <thead>
        <tr>
          <th>Sıra</th>
          <th>BR kod</th>
          <th>Növü</th>
          <th>Tay nömrəsi</th>
          <th>Çəkisi</th>
          <th>Sıra</th>
          <th>Tarix & Saat</th>
        </tr>
      </thead>
      <tbody id="reportTableBody">
      </tbody>
    </table>

    <!-- Bütün hesabatı sil düyməsi -->
    <button class="btn btn-danger w-100 mt-3" onclick="clearJSONBin()"><i class="fas fa-trash"></i> Bütün Hesabatı Sil</button>
  </div>

  <script>
    const JSONBIN_API_KEY = "YOUR_SECRET_API_KEY";
    const JSONBIN_BIN_ID = "YOUR_BIN_ID";
    const JSONBIN_URL = `https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`;
    let reportData = [];

    function loadReportData() {
      $.ajax({
        url: JSONBIN_URL,
        type: "GET",
        headers: { "X-Master-Key": JSONBIN_API_KEY },
        success: function(response) {
          if (response.record && Array.isArray(response.record)) {
            reportData = response.record;
            renderReportTable(reportData);
          }
        },
        error: function(error) {
          console.error("❌ JSONBin hesabatı yükləyə bilmədi:", error);
        }
      });
    }

    function renderReportTable(data) {
      const tbody = document.getElementById("reportTableBody");
      tbody.innerHTML = "";
      let totalWeight = 0;

      data.forEach((item, index) => {
        totalWeight += parseFloat(item.cekisi.replace(" kg", ""));
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${index + 1}</td>
          <td>${item.code}</td>
          <td>${item.novu}</td>
          <td>${item.tay_nomresi}</td>
          <td>${item.cekisi}</td>
          <td>${item.sira}</td>
          <td>${item.timestamp}</td>
        `;
        tbody.appendChild(tr);
      });

      document.getElementById("totalTayCount").textContent = data.length;
      document.getElementById("totalWeight").textContent = totalWeight;
    }

    function filterByDate() {
      const selectedDate = document.getElementById("searchDate").value;
      if (!selectedDate) {
        renderReportTable(reportData);
        return;
      }
      const filteredData = reportData.filter(item => item.timestamp.startsWith(selectedDate));
      renderReportTable(filteredData);
    }

    function downloadExcel() {
      const worksheet = XLSX.utils.json_to_sheet(reportData);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, 'Hesabat');
      XLSX.writeFile(workbook, 'Hesabat.xlsx');
    }

    function clearJSONBin() {
      $.ajax({
        url: JSONBIN_URL,
        type: "PUT",
        headers: { "Content-Type": "application/json", "X-Master-Key": JSONBIN_API_KEY },
        data: JSON.stringify([]),
        success: function(response) {
          console.log("✅ Hesabat JSONBin-dən silindi:", response);
          toastr.success("Bütün hesabat silindi!");
          document.getElementById("reportTableBody").innerHTML = "";
          document.getElementById("totalTayCount").textContent = "0";
          document.getElementById("totalWeight").textContent = "0";
        },
        error: function(error) {
          console.error("❌ Hesabatı silmək alınmadı:", error);
          toastr.error("Hesabatı silmək zamanı xəta baş verdi!");
        }
      });
    }

    document.getElementById("searchDate").addEventListener("change", filterByDate);
    loadReportData();
  </script>
</body>
</html>
